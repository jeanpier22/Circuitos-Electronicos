    <!--
      ====================================================== Open Graph
      Tarjeta que se muestra al compartir el enlace en WhatsApp, Facebook,
      LinkedIn, Telegram, Discord o Slack.

      og:image DEBE ser una URL absoluta: las redes sociales leen el HTML desde
      sus propios servidores y no pueden resolver rutas relativas. Si algún día
      cambia el dominio, hay que actualizar las cuatro URL de este bloque.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laboratorios de Circuitos Electrónicos" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:url" content="https://jeanpier22.github.io/Circuitos-Electronicos/" />
    <meta property="og:title" content="Laboratorios de Circuitos Electrónicos · UCSP" />
    <meta
      property="og:description"
      content="Guías de práctica, documentos descargables y canal directo de retroalimentación. Curso 2026-2, Ing. Electrónica y de Telecomunicaciones."
    />
    <meta
      property="og:image"
      content="https://jeanpier22.github.io/Circuitos-Electronicos/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Portada del sitio de laboratorios de Circuitos Electrónicos de la Universidad Católica San Pablo"
    />

    <!-- ===================================================== Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    />
